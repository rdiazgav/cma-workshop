# rolebinding.yaml
# Purpose: RoleBinding in openshift-monitoring that grants keda-trigger-sa (in cma-demo)
# permission to query thanos-querier via the thanos-metrics-reader Role.
# A RoleBinding (not ClusterRoleBinding) limits this SA's monitoring access to the
# openshift-monitoring namespace scope rather than the full cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keda-trigger-sa-thanos-metrics-reader
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/part-of: cma-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: thanos-metrics-reader
subjects:
  - kind: ServiceAccount
    name: keda-trigger-sa
    namespace: cma-demo
