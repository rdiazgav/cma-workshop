# rolebinding.yaml
# Purpose: RoleBinding in cma-demo that grants keda-trigger-sa the thanos-metrics-reader
# Role. The tenancy port (9092) checks this SA's pod-read access to enforce that only
# cma-demo metrics are accessible - no cross-namespace metric reads.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keda-trigger-sa-thanos-metrics-reader
  namespace: cma-demo
  labels:
    app.kubernetes.io/part-of: cma-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: thanos-metrics-reader
subjects:
  - kind: ServiceAccount
    name: keda-trigger-sa
    namespace: cma-demo
