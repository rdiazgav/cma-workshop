# triggerauth.yaml
# Purpose: TriggerAuthentication that tells KEDA to request a bound ServiceAccount
# token for keda-trigger-sa and pass it as the bearerToken to thanos-querier.
# Requires keda-token-role.yaml to grant keda-operator the create/serviceaccounts/token
# permission in this namespace.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-trigger-auth-prometheus
  namespace: cma-demo
  labels:
    app.kubernetes.io/part-of: cma-demo
spec:
  boundServiceAccountToken:
    - parameter: bearerToken
      serviceAccountName: keda-trigger-sa
      audiences:
        - https://kubernetes.default.svc
