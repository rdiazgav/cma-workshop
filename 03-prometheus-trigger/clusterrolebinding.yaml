# clusterrolebinding.yaml
# Purpose: Grants the keda-trigger-sa ServiceAccount the cluster-monitoring-view
# ClusterRole so it can query thanos-querier with a bearer token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keda-trigger-sa-cluster-monitoring-view
  labels:
    app.kubernetes.io/part-of: cma-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: keda-trigger-sa
    namespace: cma-demo
