# triggerauth-secret.yaml
# Purpose: Secret holding the bearer token for KEDA to authenticate to thanos-querier.
# ${THANOS_TOKEN} is substituted at apply time using envsubst.
# Run: envsubst < 03-prometheus-trigger/triggerauth-secret.yaml | oc apply --context crc -f -
apiVersion: v1
kind: Secret
metadata:
  name: keda-trigger-auth-prometheus-secret
  namespace: cma-demo
  labels:
    app.kubernetes.io/part-of: cma-demo
type: Opaque
stringData:
  bearerToken: "${THANOS_TOKEN}"
