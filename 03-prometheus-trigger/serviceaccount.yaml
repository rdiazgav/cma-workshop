# serviceaccount.yaml
# Purpose: ServiceAccount used by KEDA to authenticate to thanos-querier.
# This SA is granted thanos-metrics-reader access via rolebinding.yaml in openshift-monitoring.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-trigger-sa
  namespace: cma-demo
  labels:
    app.kubernetes.io/part-of: cma-demo
