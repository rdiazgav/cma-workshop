# scaledobject.yaml
# Purpose: ScaledObject that scales the myboot Deployment based on CPU utilization.
# Scales between 1 and 5 replicas when average CPU crosses 50% of the requested limit.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: myboot-cpu-scaler
  namespace: cma-demo
spec:
  scaleTargetRef:
    name: myboot
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 30
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"
