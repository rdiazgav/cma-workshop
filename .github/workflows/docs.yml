name: docs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    name: "Build and deploy site"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build site with Antora
        run: |
          npm ci
          npx antora --stacktrace site.yml

      - name: Check collapsible verification blocks rendered
        run: |
          fail=0
          for f in documentation/modules/ROOT/pages/*.adoc; do
            p=$(basename "$f" .adoc)
            [ "$p" = "_attributes" ] && continue
            src=$(grep -c '%collapsible' "$f" || true)
            out=$(grep -c '<details' "gh-pages/cma-workshop/$p.html" || true)
            echo "$p adoc=$src html=$out"
            [ "$src" = "$out" ] || fail=1
          done
          exit $fail

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gh-pages
          branch: gh-pages
          commit-message: "[CI] Publish Documentation for ${{ github.sha }}"
